name: Automatisation des tests DevSecOps
 
on: push
 
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Créer le dossier reports
        run: mkdir -p reports
 
      - name: Scan requirements.txt avec Trivy (rapport + non bloquant)
        run: |
          echo "🔍 Scan des dépendances avec Trivy (requirements.txt)…"
 
          docker run --rm -v "$PWD":/app -w /app aquasec/trivy:latest fs \
            --scanners vuln \
            --pkg-types library \
            --file-patterns 'pip:requirements\.txt' \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            /app | tee reports/trivy-deps.txt
 
          echo "⚠️ Le pipeline continue même si des vulnérabilités sont trouvées."
 
      - name: Upload rapport dépendances
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-deps
          path: reports/trivy-deps.txt
 
  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Créer le dossier reports
        run: mkdir -p reports
 
      - name: Analyse du Dockerfile avec Trivy (rapport + non bloquant)
        run: |
          echo "🔍 Analyse du Dockerfile (config scan)…"
 
          docker run --rm -v "$PWD":/app -w /app aquasec/trivy:latest config \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            /app | tee reports/trivy-dockerfile.txt
 
          echo "⚠️ Le pipeline continue même si des problèmes sont détectés."
 
      - name: Upload rapport Dockerfile
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports-dockerfile
          path: reports/trivy-dockerfile.txt
 
  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
